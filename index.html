<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="これはJavaScriptの課題作品です。">

    <title>Fashion Style 診断</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
<div class="container">

    <h1> Fashion Style 診断 </h1>
    <p class="sub-title">
        今日のお洋服を選んでね！
    </p>



<!--診断画面 -->
<div id="quiz" class="question">

    <div id="progress" class="progress">
     Q1 / 3
     </div>

     <h2 id="question-text">
        まず、今日の気分は？
     </h2>

     <div id="answers"></div>

     </div>

<!--結果画面-->
<div id="result" class="result hidden">

<div id="result-icon" class="result-icon">
    <!---リボンのアイコン挿入-->>
</div>

<p>あなたの結果は……</p>

<div id="result-name" class="result-name">
    ガーリー
</div>

<p id="result-description">
    甘くて可愛い雰囲気が似合うタイプ  <!--文字横にハートのアイコン挿入-->>
</p>

<button class="restart-button" onclick="restartQuiz()">
    もう一度診断する
</button>

</div>

</div>




    <footer>
        <p>&copy; 今日のお洋服</p>
    </footer>

    
    <script src="js/script -01.js"></script>
    <script src="js/script -02.js"></script>


</body>

</html>
